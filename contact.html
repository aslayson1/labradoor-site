<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us: Labradoor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #6B5CE7;
      --purple-dark: #403A86;
      --purple-light: #8B7CF7;
      --navy: #2D3154;
      --navy-dark: #1A1B2E;
      --teal: #4ECDC4;
      --pink: #E056A0;
      --text: #22253A;
      --text-muted: #687087;
      --line: rgba(45,49,84,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(199,125,255,.18), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(78,205,196,.15), transparent 25%),
        linear-gradient(180deg, #EEF0FF 0%, #FAFBFF 34%, #FFFFFF 100%);
      min-height: 100vh;
      line-height: 1.7;
    }

    a { color: var(--purple); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { 
      width: min(600px, calc(100% - 48px)); 
      margin: 0 auto; 
    }

    /* Header */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.75);
      border-bottom: 1px solid rgba(45,49,84,0.06);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 78px;
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
    }
    .logo {
      display: flex;
      align-items: center;
      margin-left: -12px;
    }
    .logo-img {
      height: 32px;
      width: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 50%, var(--pink) 100%);
      color: white;
      box-shadow: 0 16px 40px rgba(107, 92, 231, 0.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      text-decoration: none;
      box-shadow: 0 20px 50px rgba(107, 92, 231, 0.35);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .login-link {
      font-size: 15px;
      font-weight: 600;
      color: var(--navy);
    }
    .login-link:hover { color: var(--purple); }

    /* Content */
    .content {
      padding: 160px 0 80px;
      text-align: center;
    }
    .page-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--navy-dark);
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }
    .page-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 48px;
    }

    /* Contact Card */
    .contact-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 20px 60px rgba(26,27,46,0.08);
      text-align: left;
    }

    .form-group {
      margin-bottom: 24px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: #FAFBFF;
      transition: all 0.2s ease;
    }
    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--purple);
      background: white;
      box-shadow: 0 0 0 4px rgba(107, 92, 231, 0.1);
    }
    .form-textarea {
      min-height: 150px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 18px 28px;
      font-size: 16px;
      margin-top: 8px;
    }

    /* Direct Contact */
    .direct-contact {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
      text-align: center;
    }
    .direct-contact h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 12px;
    }
    .email-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: var(--purple);
    }
    .email-link:hover {
      color: var(--purple-dark);
    }

    /* Footer */
    .footer {
      padding: 32px 0;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.5);
      margin-top: 80px;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
    }
    .footer a {
      color: var(--text-muted);
    }
    .footer a:hover { color: var(--purple); text-decoration: none; }
    .footer-links {
      display: flex;
      gap: 28px;
    }

    @media (max-width: 600px) {
      .page-title { font-size: 32px; }
      .contact-card { padding: 32px 24px; }
      .footer-inner {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <img src="logo.png" alt="Labradoor" class="logo-img">
      </a>
      <div class="header-actions">
        <a href="https://apps.apple.com/us/app/labradoor/id6795967598" class="btn">Download Free</a>
        <a href="https://app.labradoor.ai/auth" class="login-link">Log In</a>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="container">
      <h1 class="page-title">Get in Touch</h1>
      <p class="page-subtitle">Have a question, feedback, or need help? We'd love to hear from you.</p>

      <div class="contact-card">
        <form action="https://formsubmit.co/hello@labradoor.ai" method="POST">
          <!-- FormSubmit configuration -->
          <input type="hidden" name="_subject" value="New Labradoor Contact Form Submission">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_next" value="https://www.labradoor.ai/thank-you">
          <input type="text" name="_honey" style="display:none">

          <div class="form-group">
            <label class="form-label" for="name">Your Name</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="subject">Subject</label>
            <input type="text" id="subject" name="subject" class="form-input" placeholder="How can we help?">
          </div>

          <div class="form-group">
            <label class="form-label" for="message">Message</label>
            <textarea id="message" name="message" class="form-textarea" placeholder="Tell us what's on your mind..." required></textarea>
          </div>

          <button type="submit" class="btn submit-btn">Send Message</button>
        </form>

        <div class="direct-contact">
          <h3>Or email us directly</h3>
          <a href="mailto:hello@labradoor.ai" class="email-link">
            ✉️ hello@labradoor.ai
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>© 2026 Labradoor. Property intelligence for everyone.</div>
      <div class="footer-links">
        <a href="contact">Contact</a>
        <a href="privacy">Privacy</a>
        <a href="terms">Terms</a>
      </div>
    </div>
  </footer>
</body>
</html>
