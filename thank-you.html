<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent: Labradoor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #6B5CE7;
      --purple-dark: #403A86;
      --purple-light: #8B7CF7;
      --navy: #2D3154;
      --navy-dark: #1A1B2E;
      --teal: #4ECDC4;
      --pink: #E056A0;
      --text: #22253A;
      --text-muted: #687087;
      --line: rgba(45,49,84,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(199,125,255,.18), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(78,205,196,.15), transparent 25%),
        linear-gradient(180deg, #EEF0FF 0%, #FAFBFF 34%, #FFFFFF 100%);
      min-height: 100vh;
      line-height: 1.7;
    }

    a { color: var(--purple); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { 
      width: min(600px, calc(100% - 48px)); 
      margin: 0 auto; 
    }

    /* Header */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.75);
      border-bottom: 1px solid rgba(45,49,84,0.06);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 78px;
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
    }
    .logo {
      display: flex;
      align-items: center;
    }
    .logo-img {
      height: 32px;
      width: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 50%, var(--pink) 100%);
      color: white;
      box-shadow: 0 16px 40px rgba(107, 92, 231, 0.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      text-decoration: none;
      box-shadow: 0 20px 50px rgba(107, 92, 231, 0.35);
    }

    /* Content */
    .content {
      padding: 200px 0 80px;
      text-align: center;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--teal), #3BA99E);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 32px;
      box-shadow: 0 16px 40px rgba(78, 205, 196, 0.3);
    }
    .page-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--navy-dark);
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }
    .page-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 40px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--purple);
    }

    /* Footer */
    .footer {
      padding: 32px 0;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.5);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
    }
    .footer a {
      color: var(--text-muted);
    }
    .footer a:hover { color: var(--purple); text-decoration: none; }
    .footer-links {
      display: flex;
      gap: 28px;
    }

    @media (max-width: 600px) {
      .page-title { font-size: 32px; }
      .footer-inner {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <img src="logo.png" alt="Labradoor" class="logo-img">
      </a>
      <a href="https://apps.apple.com/" class="btn">Download Free</a>
    </div>
  </header>

  <main class="content">
    <div class="container">
      <div class="success-icon">✓</div>
      <h1 class="page-title">Message Sent!</h1>
      <p class="page-subtitle">Thanks for reaching out. We'll get back to you as soon as possible.</p>
      <a href="/" class="back-link">← Back to Home</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>© 2026 Labradoor. Property intelligence for everyone.</div>
      <div class="footer-links">
        <a href="contact">Contact</a>
        <a href="privacy">Privacy</a>
        <a href="terms">Terms</a>
      </div>
    </div>
  </footer>
</body>
</html>
